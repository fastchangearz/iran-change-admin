<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ایران چنج | مینی‌چت</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1325;color:#f4f4f5}.app{max-width:720px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:22px 18px;background:#14213b;border-bottom:1px solid #35415b}h1{font-size:21px;margin:0 0 8px;color:#f4d18a}.muted{font-size:12px;color:#b5bfd0}main{padding:16px;flex:1;display:flex;flex-direction:column;min-height:0}.select{width:100%;padding:13px;background:#1e2e4d;border:1px solid #455673;border-radius:12px;color:white;font-size:15px}.messages{margin-top:14px;flex:1;min-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px 2px}.bubble{max-width:85%;padding:12px 14px;border-radius:14px;line-height:1.9;overflow-wrap:anywhere;white-space:pre-wrap;background:#283651;align-self:flex-start}.bubble.mine{background:#735c31;align-self:flex-end}.who{font-size:11px;opacity:.8;margin-bottom:3px}.date{font-size:10px;opacity:.6;text-align:left}.compose{display:flex;gap:8px;align-items:stretch;padding:12px 0 22px}textarea{resize:none;min-height:58px;flex:1;background:#18263f;border:1px solid #465674;border-radius:12px;color:#fff;padding:12px;font:inherit}button{border:0;border-radius:12px;background:#e5be74;color:#17213b;font-weight:bold;padding:0 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.notice{padding:10px 12px;border-radius:10px;background:#473820;color:#f8dda8;font-size:12px;line-height:1.8;margin-top:10px}#error{color:#ffb6b6;font-size:13px;min-height:22px}</style></head>
<body><div class="app"><header><h1>💬 گفت‌وگوی خصوصی ایران چنج</h1><div class="muted">ارتباط محرمانه شما با مدیریت؛ طرف دیگر معامله به این گفتگو دسترسی ندارد.</div></header><main><select id="threads" class="select" aria-label="انتخاب حواله"><option>در حال بارگذاری پرونده‌ها...</option></select><div class="notice">🔒 هر پیام در پرونده همین حواله ثبت می‌شود. فعلاً فقط پیام متنی پشتیبانی می‌شود؛ مدارک و فایل‌ها در مرحله بعد اضافه خواهند شد.</div><div id="messages" class="messages" aria-live="polite"></div><div id="error"></div><div class="compose"><textarea id="message" maxlength="4000" placeholder="پیام خود را برای مدیر بنویسید..."></textarea><button id="send">ارسال</button></div></main></div>
<script>
(()=>{'use strict';const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||'';const sel=document.getElementById('threads'),area=document.getElementById('messages'),error=document.getElementById('error'),input=document.getElementById('message'),send=document.getElementById('send');let active=0,closed=false,busy=false;const showError=s=>{error.textContent=s||''};async function api(path,options={}){const response=await fetch(path,{...options,headers:{'X-Telegram-Init-Data':init,'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json();if(!response.ok)throw Error(body.error||'خطا در ارتباط با سرور');return body}function label(t){return `حواله ${t.ad_id} — ${t.participant_role==='owner'?'صاحب آگهی':'پیشنهاددهنده'}${t.status==='active'?'':' (بسته)'}`}async function loadThreads(){if(!init){showError('لطفاً مینی‌چت را از دکمه داخل ربات ایران چنج باز کنید.');sel.innerHTML='<option>ورود نامعتبر</option>';return}try{const data=await api('/minichat/api/threads');sel.innerHTML='';if(!data.threads.length){sel.innerHTML='<option>هنوز پرونده گفت‌وگویی برای شما وجود ندارد</option>';return}for(const t of data.threads){const opt=document.createElement('option');opt.value=t.thread_id;opt.textContent=label(t);sel.append(opt)}active=Number(sel.value);await loadMessages()}catch(e){showError(e.message)}}async function loadMessages(){if(!active)return;try{const id=active;const data=await api('/minichat/api/messages/'+id);if(id!==active)return;closed=data.status!=='active';send.disabled=closed;input.disabled=closed;area.replaceChildren();for(const m of data.messages){const b=document.createElement('div');b.className='bubble'+(m.sender_role==='participant'?' mine':'');const who=document.createElement('div');who.className='who';who.textContent=m.sender_role==='admin'?'🛡 مدیر':'👤 شما';const content=document.createElement('div');content.textContent=m.message_text||'[پیام غیرمتنی]';const date=document.createElement('div');date.className='date';date.textContent=m.created_at?new Date(m.created_at).toLocaleString('fa-IR'):'';b.append(who,content,date);area.append(b)}area.scrollTop=area.scrollHeight;showError(closed?'این پرونده بسته شده و فقط قابل مشاهده است.':'')}catch(e){showError(e.message)}}sel.addEventListener('change',()=>{active=Number(sel.value);loadMessages()});send.addEventListener('click',async()=>{const msg=input.value.trim();if(!msg||busy||!active||closed)return;busy=true;send.disabled=true;try{await api('/minichat/api/send',{method:'POST',body:JSON.stringify({thread_id:active,message_text:msg})});input.value='';await loadMessages()}catch(e){showError(e.message)}finally{busy=false;send.disabled=closed}});loadThreads();document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMessages()});setInterval(()=>{if(!document.hidden&&active&&!busy)loadMessages()},12000)})();
</script></body></html>
