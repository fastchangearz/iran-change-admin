<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ایران چنج | مینی‌چت</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1325;color:#f4f4f5}.app{max-width:100%;margin:auto;height:100dvh;min-height:0;display:flex;flex-direction:column}header{flex-shrink:0;padding:20px 16px;background:#14213b;border-bottom:1px solid #35415b}h1{font-size:20px;margin:0 0 8px;color:#f4d18a}.muted{font-size:12px;color:#b5bfd0;line-height:1.8}main{overflow:hidden;padding:14px;flex:1;display:flex;flex-direction:column;min-height:0}.select{width:100%;padding:13px;background:#1e2e4d;border:1px solid #455673;border-radius:12px;color:white;font-size:15px}.messages{margin-top:12px;flex:1;min-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px 2px}.bubble{max-width:87%;padding:11px 13px;border-radius:14px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap;background:#283651;align-self:flex-start}.bubble.mine{background:#735c31;align-self:flex-end}.who{font-size:11px;opacity:.8;margin-bottom:3px}.date{font-size:10px;opacity:.7;text-align:left;margin-top:5px}.compose{display:flex;gap:7px;align-items:center;padding:10px 0 max(12px,env(safe-area-inset-bottom))}textarea{resize:none;max-height:120px;min-height:52px;flex:1;min-width:0;background:#18263f;border:1px solid #465674;border-radius:12px;color:#fff;padding:10px;font:inherit;font-size:13px}button{border:0;border-radius:12px;background:#e5be74;color:#17213b;font-weight:bold;padding:12px;cursor:pointer;font-family:inherit}button:disabled{opacity:.45;cursor:default}.iconbtn{font-size:20px;padding:10px 12px;min-width:43px}.recording{background:#ed8d89!important}.notice{padding:9px 11px;border-radius:10px;background:#26344a;color:#c9d4e5;font-size:12px;line-height:1.8;margin-top:10px}#error{color:#ffb6b6;font-size:12px;min-height:20px;line-height:1.7}.attachment{border:1px solid #a9a1a055;border-radius:10px;padding:8px;margin-top:5px;display:flex;flex-direction:column;gap:5px}.attachment button{background:#d8e4fa;color:#17213b;padding:8px 10px;font-size:12px}.attachment .filename{font-size:12px;direction:auto;text-align:right;overflow-wrap:anywhere}.hint{font-size:11px;color:#aab6ca;margin-bottom:4px}#progress{font-size:12px;color:#f4d18a;min-height:16px}.hidden{display:none}

/* Full-screen mobile chat */
html,body{height:100%;overflow:hidden}body{background:#0b1423}
.app{height:100dvh;min-height:0;max-width:none;width:100%;overflow:hidden}
header{flex-shrink:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#152238}
header h1{font-size:16px;margin:0 0 4px}header .muted{font-size:10px}
main{padding:0;flex:1;min-height:0;overflow:hidden}
.select{margin:8px 12px;width:calc(100% - 24px);flex-shrink:0;padding:10px 12px;font-size:13px}
.notice{display:none}.messages{margin:0;padding:12px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#101e32,#0b1423)}
.bubble{max-width:min(85%,600px);border-radius:17px;background:#263852;padding:10px 13px}.bubble.mine{background:#315346}
#recordHint{display:none}#error,#progress{padding:0 12px;min-height:0;flex-shrink:0}
.compose{flex-shrink:0;background:#152238;border-top:1px solid #33445c;margin:0;padding:10px 9px calc(10px + env(safe-area-inset-bottom));gap:6px}
.compose textarea{min-height:44px;max-height:115px;border-radius:16px;padding:11px 10px;font-size:14px}
.compose button{min-height:44px;padding:9px 10px;border-radius:13px}
.attachment button{min-height:35px}
</style>
</head>
<body><div class="app"><header><h1>💬 گفت‌وگوی خصوصی ایران چنج</h1><div class="muted">ارتباط محرمانه شما با مدیریت؛ طرف دیگر معامله به این گفت‌وگو دسترسی ندارد.</div></header>
<main><select id="threads" class="select" aria-label="انتخاب حواله"><option>در حال بارگذاری پرونده‌ها...</option></select>
<div class="notice">🔒 گفت‌وگوی محرمانه • حداکثر فایل ۲۰ مگابایت</div>
<div id="messages" class="messages" aria-live="polite"></div><div id="error" role="alert"></div><div id="progress" aria-live="polite"></div>
<div class="hint" id="recordHint">📎 عکس، فیلم، صدا و مدارک | 🎤 ضبط ویس</div>
<div class="compose"><button id="attach" class="iconbtn" title="انتخاب فایل" aria-label="انتخاب فایل">📎</button><button id="voice" class="iconbtn" title="شروع ضبط ویس" aria-label="شروع ضبط ویس">🎤</button><textarea id="message" maxlength="4000" placeholder="پیام خود را برای مدیر بنویسید..."></textarea><button id="send">ارسال</button></div>
<input type="file" id="file" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.heic,.heif,application/*">
</main></div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const init=tg?.initData||'';
const sel=document.getElementById('threads'),area=document.getElementById('messages'),error=document.getElementById('error'),input=document.getElementById('message'),send=document.getElementById('send'),attach=document.getElementById('attach'),voice=document.getElementById('voice'),fileInput=document.getElementById('file'),progress=document.getElementById('progress'),recordHint=document.getElementById('recordHint');
let active=0,closed=false,busy=false,loading=false,recorder=null,recordStream=null,recordChunks=[],recordThread=0;
const MAX=20*1024*1024;
let messageSignature='',lastThread=0;
const messageKey=m=>String(m.message_id??'')+':'+String(m.message_type??'')+':'+String(m.message_text??'');

const showError=s=>{error.textContent=s||''};
function updateControls(){send.disabled=closed||busy||!active;attach.disabled=closed||busy||!active;voice.disabled=closed||busy||!active;input.disabled=closed||!active;sel.disabled=busy||!!recorder;}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'X-Telegram-Init-Data':init,...(options.headers||{})}});let body;try{body=await response.json()}catch{throw Error('پاسخ نامعتبر از سرور')}if(!response.ok)throw Error(body.error||'خطا در ارتباط با سرور');return body}
function label(t){return `حواله ${t.ad_id} — ${t.participant_role==='owner'?'صاحب آگهی':'پیشنهاددهنده'}${t.status==='active'?'':' (بسته)'}`}
async function loadThreads(){if(!init){showError('لطفاً مینی‌چت را از دکمه داخل ربات ایران چنج باز کنید.');sel.innerHTML='<option>ورود نامعتبر</option>';return}try{const data=await api('/minichat/api/threads');sel.replaceChildren();if(!data.threads.length){sel.innerHTML='<option>هنوز پرونده گفت‌وگویی برای شما وجود ندارد</option>';return}for(const t of data.threads){const opt=document.createElement('option');opt.value=t.thread_id;opt.textContent=label(t);sel.append(opt)}active=Number(sel.value);updateControls();await loadMessages()}catch(e){showError(e.message)}}
async function downloadFile(messageId,filename,button){button.disabled=true;progress.textContent='در حال دریافت فایل...';try{const response=await fetch('/minichat/api/files/'+messageId,{headers:{'X-Telegram-Init-Data':init}});if(!response.ok)throw Error('دریافت فایل ناموفق بود ('+response.status+')');const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename||'document';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);progress.textContent='فایل دریافت شد.'}catch(e){showError(e.message);progress.textContent=''}finally{button.disabled=false}}
function addMessage(m){const b=document.createElement('div');b.className='bubble'+(m.sender_role==='participant'?' mine':'');b.dataset.messageId=String(m.message_id||'');const who=document.createElement('div');who.className='who';who.textContent=m.sender_role==='admin'?'🛡 مدیر':'👤 شما';b.append(who);if(m.message_type==='file'&&m.message_id){const panel=document.createElement('div');panel.className='attachment';const name=document.createElement('div');name.className='filename';name.textContent='📎 '+(m.message_text||'فایل پیوست');const btn=document.createElement('button');btn.type='button';btn.textContent='⬇️ دریافت فایل';btn.addEventListener('click',()=>downloadFile(m.message_id,m.message_text,btn));panel.append(name,btn);b.append(panel)}else{const content=document.createElement('div');content.textContent=m.message_text||'[پیام غیرمتنی]';b.append(content)}const date=document.createElement('div');date.className='date';date.textContent=m.created_at?new Date(m.created_at).toLocaleString('fa-IR'):'';b.append(date);area.append(b)}
let displayedThread=0,lastSignature='',refreshing=false;
function signature(messages){return messages.map(m=>String(m.message_id||'')+':'+String(m.message_type||'')).join('|')}
async function loadMessages(force=false){
 if(!active||loading||busy)return;loading=true;
 try{const id=active;const data=await api('/minichat/api/messages/'+id);
  if(id!==active)return;
  closed=data.status!=='active';const messages=data.messages||[];
  const sig=signature(messages),different=displayedThread!==id;
  if(force||different){area.replaceChildren();for(const m of messages)addMessage(m);displayedThread=id;lastSignature=sig;area.scrollTop=area.scrollHeight;}
  else if(sig!==lastSignature){
   const nearBottom=area.scrollHeight-area.scrollTop-area.clientHeight<135;
   const known=new Set([...area.querySelectorAll('[data-message-id]')].map(n=>n.dataset.messageId));
   // A replaced/edited message list is rare; fall back to a full update only then.
   const ids=messages.map(m=>String(m.message_id||''));
   const existing=[...area.querySelectorAll('[data-message-id]')].map(n=>n.dataset.messageId);
   const appendOnly=existing.every((v,i)=>ids[i]===v);
   if(!appendOnly){area.replaceChildren();for(const m of messages)addMessage(m);}
   else for(let i=existing.length;i<messages.length;i++)addMessage(messages[i]);
   lastSignature=sig;if(nearBottom||!existing.length)area.scrollTop=area.scrollHeight;
  }
  showError(closed?'این پرونده بسته شده و فقط قابل مشاهده است.':'');
 }catch(e){showError(e.message)}finally{loading=false;updateControls()}
}
async function uploadFile(file,threadId=active){if(!file||busy||!threadId||closed)return;if(file.size>MAX){showError('حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.');return}if(!file.size){showError('فایل خالی است.');return}busy=true;updateControls();showError('');progress.textContent='در حال ارسال '+file.name+' ...';try{const data=new FormData();data.append('thread_id',String(threadId));data.append('file',file,file.name);await api('/minichat/api/upload',{method:'POST',body:data});progress.textContent='✅ فایل ارسال شد.'}catch(e){showError('ارسال فایل انجام نشد: '+e.message);progress.textContent=''}finally{busy=false;fileInput.value='';updateControls();await loadMessages()}}
sel.addEventListener('change',()=>{active=Number(sel.value);closed=false;updateControls();loadMessages(true)});
send.addEventListener('click',async()=>{const msg=input.value.trim();if(!msg||busy||!active||closed)return;busy=true;updateControls();try{await api('/minichat/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thread_id:active,message_text:msg})});input.value='';busy=false;await loadMessages();showError('')}catch(e){showError(e.message)}finally{busy=false;updateControls()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});
attach.addEventListener('click',()=>{if(!busy&&!closed&&active)fileInput.click()});
fileInput.addEventListener('change',()=>{const chosen=fileInput.files?.[0];if(chosen)uploadFile(chosen)});
function stopStream(){if(recordStream){recordStream.getTracks().forEach(track=>track.stop());recordStream=null}}
voice.addEventListener('click',async()=>{if(busy||closed||!active)return;if(recorder&&recorder.state==='recording'){recorder.stop();voice.disabled=true;progress.textContent='در حال آماده‌سازی ویس...';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showError('ضبط ویس در این مرورگر پشتیبانی نمی‌شود؛ از 📎 فایل صوتی انتخاب کنید.');return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';recorder=new MediaRecorder(recordStream,type?{mimeType:type}:undefined);recordChunks=[];recordThread=active;recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onerror=()=>{showError('ضبط صدا با خطا مواجه شد.');stopStream();recorder=null;voice.classList.remove('recording');recordHint.textContent='📎 عکس، فیلم، صدا و مدارک | 🎤 ضبط ویس';updateControls()};recorder.onstop=async()=>{const mime=recorder?.mimeType||type||'audio/webm';stopStream();recorder=null;voice.classList.remove('recording');recordHint.textContent='📎 عکس، فیلم، صدا و مدارک | 🎤 ضبط ویس';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const blob=new Blob(recordChunks,{type:mime});recordChunks=[];if(blob.size){const name='voice-'+Date.now()+'.'+ext;await uploadFile(new File([blob],name,{type:mime}),recordThread)}else{showError('صدایی ضبط نشد.')}updateControls()};recorder.start(1000);voice.classList.add('recording');recordHint.textContent='🔴 در حال ضبط ویس — برای پایان و ارسال دوباره 🎤 را بزنید';showError('');updateControls()}catch(e){stopStream();recorder=null;showError('اجازه دسترسی به میکروفون داده نشد یا ضبط پشتیبانی نمی‌شود.');updateControls()}});
loadThreads();document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMessages()});setInterval(()=>{if(!document.hidden&&active&&!busy&&!recorder)loadMessages()},2000);
})();
</script></body></html>
