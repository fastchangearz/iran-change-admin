<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرکز مدیریت ایران چنج ارز</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b28;color:#eef3f8;font:15px Tahoma,Arial}main{max-width:760px;margin:auto;height:100dvh;display:flex;flex-direction:column}header,footer{padding:12px;background:#203246}header{color:#e7c681;font-weight:bold}button,input,textarea{font:inherit;color:inherit;background:#263b50;border:0;border-radius:10px;padding:12px}button{cursor:pointer}input,textarea{width:100%}section{padding:12px;overflow:auto;flex:1;min-height:0}.row{display:flex;gap:10px;align-items:center;padding:15px 4px;border-bottom:1px solid #344557;cursor:pointer}.grow{flex:1}small{display:block;color:#aabed0;margin-top:6px}.bubble{background:#263b50;padding:12px;border-radius:15px;width:fit-content;max-width:85%;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mine{background:#245d87;margin-right:auto}footer{display:flex;gap:6px}#err{color:#ffb6b6;padding:0 12px}button:disabled{opacity:.5}form{display:grid;gap:12px} .gold{color:#e7c681}
</style><main><header id="head">ایران چنج ارز | مرکز مدیریت</header><div id="err" role="alert"></div><section id="body"></section><footer id="foot" hidden></footer></main><script>
'use strict';const $=id=>document.getElementById(id),root=$('body'),foot=$('foot');let token='',challenge='',cases=[],selected=null,thread=null,role='',view='login',archive=false,query='',generation=0,busy=false,history=[],timer=null;function node(tag,text,parent){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(parent)parent.append(n);return n}function btn(text,fn,parent=root){const b=node('button',text,parent);b.onclick=fn;return b}function err(e){$('err').textContent=e?.message||String(e||'')}async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',cache:'no-store',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}function clear(v,title){generation++;view=v;root.replaceChildren();foot.replaceChildren();foot.style.display='none';$('head').textContent=title;err('')}function login(mfa=false){clear('login','ورود امن | ایران چنج ارز');const f=node('form',null,root);const a=node('input',null,f);a.placeholder=mfa?'کد تأیید شش رقمی':'شناسه مدیریت';a.required=true;const p=node('input',null,f);p.type='password';p.placeholder='رمز عبور';p.hidden=mfa;p.required=!mfa;const b=node('button','ورود',f);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{if(!mfa){challenge=(await api('/staff/login',{staff_code:a.value.trim(),password:p.value})).challenge_token;login(true)}else{token=(await api('/staff/mfa/verify',{challenge_token:challenge,code:a.value.trim()})).access_token;challenge='';await loadCases()}}catch(e){err(e)}finally{b.disabled=false}}}async function loadCases(){clear('list','حواله‌های ایران چنج ارز');try{let all=[],before;do{const x=await api('/center/api/cases'+(before?'?before='+before:''));all.push(...x.cases);if(x.cases.length<100)break;before=x.cases.at(-1).agreement_id}while(true);cases=all;renderList()}catch(e){err(e);btn('تلاش مجدد',loadCases)}}function renderList(){clear('list','حواله‌های ایران چنج ارز');const bar=node('div',null,root);btn(archive?'بازگشت به فعال':'بایگانی',()=>{archive=!archive;renderList()},bar);btn('به‌روزرسانی',loadCases,bar);btn('خروج',async()=>{try{await api('/staff/logout',{});token='';login()}catch(e){err(e)}},bar);const s=node('input',null,root);s.placeholder='جستجوی شماره حواله';s.value=query;const list=node('div',null,root);function draw(){list.replaceChildren();for(const c of cases.filter(c=>(archive?c.status!=='active':c.status==='active')&&String(c.ad_id).includes(query))){const r=node('div',null,list);r.className='row';node('span','📁',r);const x=node('div',null,r);x.className='grow';node('strong','حواله '+c.ad_id+' | '+(c.ad.amount||'')+' '+(c.ad.currency||''),x);node('small','پیشنهاد '+c.offer_id+' | '+(c.ad.method||''),x);r.onclick=()=>openCase(c)}if(!list.children.length)node('p','پرونده‌ای یافت نشد.',list)}s.oninput=()=>{query=s.value.replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x));draw()};draw()}async function openCase(c){selected=c;clear('case','حواله '+c.ad_id+' | پیشنهاد '+c.offer_id);btn('بازگشت',renderList);try{const g=generation;const x=await api('/admin/minichat/threads/'+c.agreement_id);if(g!==generation)return;for(const t of x.threads){const type=c.ad.trade_type||'';const owner=type.includes('خریدار')?'خریدار':type.includes('فروشنده')?'فروشنده':'';const label=owner?(t.participant_role==='owner'?owner:owner==='خریدار'?'فروشنده':'خریدار'):(t.participant_role==='owner'?'صاحب آگهی':'پیشنهاددهنده');const b=btn('💬 گفتگوی '+label,()=>openChat(t,label));b.style.cssText='display:block;width:100%;margin-top:12px'}}catch(e){err(e)}}async function openChat(t,label){thread=t;role=label;history=[];clear('chat',label+' | حواله '+selected.ad_id);btn('بازگشت',()=>openCase(selected));const older=btn('پیام‌های قدیمی‌تر',()=>refresh(true));const area=node('div',null,root);area.id='messages';foot.style.display='flex';const input=node('textarea',null,foot);input.placeholder='نوشتن پیام...';input.maxLength=4000;const send=btn('ارسال',async()=>{if(busy||!input.value.trim())return;busy=true;send.disabled=true;const g=generation;try{await api('/admin/minichat/send',{thread_id:t.thread_id,message_text:input.value.trim()});if(g===generation){input.value='';await refresh()}}catch(e){err(e)}finally{busy=false;send.disabled=false}},foot);btn('متن آماده',()=>{input.value='لطفاً رسید پرداخت را ارسال کنید.'},foot);if(selected.status!=='active'){input.disabled=true;send.disabled=true}await refresh();async function refresh(old=false){const g=generation;if(view!=='chat'||thread!==t)return;try{const x=await api('/center/api/messages/'+t.thread_id+(old&&history.length?'?before='+history[0].message_id:''));if(g!==generation)return;const map=new Map([...history,...x.messages].map(m=>[m.message_id,m]));const next=[...map.values()].sort((a,b)=>a.message_id-b.message_id);if(JSON.stringify(next)===JSON.stringify(history))return;history=next;const near=root.scrollHeight-root.scrollTop-root.clientHeight<150;area.replaceChildren();for(const m of history){const b=node('div',m.message_text||'پیوست',area);b.className='bubble'+(m.sender_role==='admin'?' mine':'');node('small',m.created_at?new Date(m.created_at).toLocaleString('fa-IR'):'',b);btn('کپی',()=>navigator.clipboard.writeText(m.message_text||'').catch(err),b);btn('پاسخ',()=>{input.value='در پاسخ به: '+(m.message_text||'')+'\n';input.focus()},b)}if(!old&&near)root.scrollTop=root.scrollHeight}catch(e){err(e)}}clearInterval(timer);timer=setInterval(()=>{if(view==='chat'&&thread===t&&!busy&&!document.hidden)refresh()},2500)}login();</script></html>
