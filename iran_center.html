<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/center-pwa/center.webmanifest">
<meta name="theme-color" content="#101b28">
<link rel="icon" href="/center-pwa/center-icon-192.png">
<script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/center-pwa/center-sw.js",{scope:"/center"}).catch(console.error));</script>
<title>مرکز مدیریت ایران چنج ارز</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101b28;color:#eef3f8;font:15px Tahoma,Arial}
main{max-width:760px;margin:auto;height:100dvh;display:flex;flex-direction:column}
header,footer{padding:12px;background:#203246}
header{color:#e7c681;font-weight:bold}
button,input,textarea{font:inherit;color:inherit;background:#263b50;border:0;border-radius:10px;padding:12px}
button{cursor:pointer}
input,textarea{width:100%}
section{padding:12px;overflow:auto;flex:1;min-height:0}
.row{display:flex;gap:10px;align-items:center;padding:15px 4px;border-bottom:1px solid #344557;cursor:pointer}
.grow{flex:1}
small{display:block;color:#aabed0;margin-top:6px}
.bubble{background:#263b50;padding:12px;border-radius:15px;width:fit-content;max-width:85%;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{background:#245d87;margin-right:auto}
footer{display:flex;gap:6px}
#err{color:#ffb6b6;padding:0 12px}
button:disabled{opacity:.5;cursor:not-allowed}
form{display:grid;gap:12px}
.gold{color:#e7c681}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.inbox-card{background:#203246;border:1px solid #344557;border-radius:14px;padding:15px;margin:12px 0}
.inbox-button{color:#e7c681;border:1px solid #8c754a}
.inbox-count{color:#e7c681;font-weight:bold;padding:10px 0}
.inbox-message{white-space:pre-wrap;overflow-wrap:anywhere;background:#263b50;border-radius:12px;padding:14px;margin:12px 0}
.candidate{padding:12px 4px;border-bottom:1px solid #344557}
.assign-button{display:block;width:100%;margin-top:12px;background:linear-gradient(135deg,#f0d18b,#b58b43);color:#17212d;font-weight:bold}
.success{color:#79e2ae;padding:10px 0}
</style>

<main>
<header id="head">ایران چنج ارز | مرکز مدیریت</header>
<div id="err" role="alert"></div>
<section id="body"></section>
<footer id="foot" hidden></footer>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id),
      root = $('body'),
      foot = $('foot');

let token = '',
    challenge = '',
    cases = [],
    selected = null,
    thread = null,
    role = '',
    view = 'login',
    archive = false,
    query = '',
    generation = 0,
    busy = false,
    history = [],
    timer = null;

const assigning = new Set();

function node(tag,text,parent){
    const n = document.createElement(tag);
    if(text != null) n.textContent = text;
    if(parent) parent.append(n);
    return n;
}

function btn(text,fn,parent=root){
    const b = node('button',text,parent);
    b.type = 'button';
    b.onclick = fn;
    return b;
}

function err(e){
    $('err').textContent = e?.message || String(e || '');
}

async function api(path,body){
    const r = await fetch(path,{
        method:body === undefined ? 'GET' : 'POST',
        cache:'no-store',
        headers:{
            ...(token ? {Authorization:'Bearer '+token} : {}),
            ...(body === undefined ? {} : {'Content-Type':'application/json'})
        },
        body:body === undefined ? undefined : JSON.stringify(body)
    });

    let j;

    try{
        j = await r.json();
    }catch(e){
        throw Error('پاسخ نامعتبر سرور؛ وضعیت را به‌روزرسانی کنید.');
    }

    if(!r.ok) throw Error(j.error || r.status);

    return j;
}

function clear(v,title){
    generation++;
    clearInterval(timer);
    timer = null;
    view = v;
    root.replaceChildren();
    foot.replaceChildren();
    foot.style.display = 'none';
    $('head').textContent = title;
    err('');
}

function login(mfa=false){
    clear('login','ورود امن | ایران چنج ارز');

    const f = node('form',null,root);

    const a = node('input',null,f);
    a.placeholder = mfa ? 'کد تأیید شش رقمی' : 'شناسه مدیریت';
    a.required = true;

    const p = node('input',null,f);
    p.type = 'password';
    p.placeholder = 'رمز عبور';
    p.hidden = mfa;
    p.required = !mfa;

    const b = node('button','ورود',f);
    b.type = 'submit';

    f.onsubmit = async e => {
        e.preventDefault();
        b.disabled = true;

        try{
            if(!mfa){
                challenge = (await api('/staff/login',{
                    staff_code:a.value.trim(),
                    password:p.value
                })).challenge_token;

                login(true);
            }else{
                token = (await api('/staff/mfa/verify',{
                    challenge_token:challenge,
                    code:a.value.trim()
                })).access_token;

                challenge = '';
                await loadCases();
            }
        }catch(e){
            err(e);
        }finally{
            b.disabled = false;
        }
    };
}

async function loadCases(){
    clear('list','حواله‌های ایران چنج ارز');

    const g = generation;

    try{
        let all = [], before;

        do{
            const x = await api(
                '/center/api/cases' +
                (before ? '?before='+before : '')
            );

            if(g !== generation) return;

            all.push(...x.cases);

            if(x.cases.length < 100) break;

            before = x.cases.at(-1).agreement_id;

        }while(true);

        cases = all;
        renderList();

    }catch(e){
        if(g !== generation) return;
        err(e);
        btn('تلاش مجدد',loadCases);
    }
}

function renderList(){
    clear('list','حواله‌های ایران چنج ارز');

    const bar = node('div',null,root);
    bar.className = 'toolbar';

    btn(
        archive ? 'بازگشت به فعال' : 'بایگانی',
        ()=>{
            archive = !archive;
            renderList();
        },
        bar
    );

    btn('به‌روزرسانی',loadCases,bar);

    if(archive){
        const inboxButton = btn('پیام‌های نیازمند بررسی',openInbox,bar);
        inboxButton.className = 'inbox-button';
    }

    btn('خروج',async()=>{
        try{
            await api('/staff/logout',{});
            token = '';
            challenge = '';
            cases = [];
            history = [];
            selected = null;
            thread = null;
            login();
        }catch(e){
            err(e);
        }
    },bar);

    const s = node('input',null,root);
    s.placeholder = 'جستجوی شماره حواله';
    s.value = query;

    const list = node('div',null,root);

    function draw(){
        list.replaceChildren();

        for(const c of cases.filter(c=>
            (archive ? c.status !== 'active' : c.status === 'active')
            && String(c.ad_id).includes(query)
        )){
            const r = node('div',null,list);
            r.className = 'row';

            node('span','📁',r);

            const x = node('div',null,r);
            x.className = 'grow';

            const ad = c.ad || {};

            node(
                'strong',
                'حواله '+c.ad_id+' | '+
                (ad.amount || '')+' '+
                (ad.currency || ''),
                x
            );

            node(
                'small',
                'پیشنهاد '+c.offer_id+' | '+
                (ad.method || ''),
                x
            );

            r.onclick = ()=>openCase(c);
        }

        if(!list.children.length){
            node('p','پرونده‌ای یافت نشد.',list);
        }
    }

    s.oninput = ()=>{
        query = s.value.replace(
            /[۰-۹]/g,
            x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)
        );

        draw();
    };

    draw();
}

async function openInbox(){

    clear('inbox','📥 صندوق انتظار پیام‌ها');

    const bar = node('div',null,root);
    bar.className = 'toolbar';

    btn('بازگشت',renderList,bar);
    btn('به‌روزرسانی',openInbox,bar);

    const notice = node('div',null,root);
    notice.className = 'success';
    notice.setAttribute('role','status');

    const count = node('div','در حال دریافت پیام‌ها...',root);
    count.className = 'inbox-count';

    const area = node('div',null,root);

    const more = btn(
        'پیام‌های قدیمی‌تر',
        ()=>loadPage(),
        root
    );

    more.hidden = true;

    const g = generation;

    let before = null;
    let loaded = 0;
    let loading = false;

    const reasons = {
        multiple_active_agreements:'چند پرونده فعال',
        no_active_agreement:'بدون پرونده فعال',
        connection_mismatch:'عدم تطابق اتصال',
        chat_mismatch:'عدم تطابق گفتگو',
        invalid_role:'نقش نامعتبر'
    };

    function updateCount(){
        count.textContent = loaded
            ? 'پیام‌های در انتظار نمایش‌داده‌شده: '+loaded
            : 'پیام دیگری در فهرست فعلی نیست.';
    }

    function drawMessage(m){

        const card = node('div',null,area);
        card.className = 'inbox-card';

        node(
            'strong',
            '📩 پیام شماره '+m.inbox_id,
            card
        ).className = 'gold';

        const message = node(
            'div',
            m.message_text || '',
            card
        );

        message.className = 'inbox-message';

        node(
            'small',
            'شناسه فرستنده: '+m.sender_id,
            card
        );

        node(
            'small',
            m.created_at
                ? new Date(m.created_at).toLocaleString('fa-IR')
                : '',
            card
        );

        node(
            'small',
            'وضعیت: در انتظار بررسی',
            card
        );

        node(
            'small',
            'علت انتظار: '+
            (reasons[m.routing_reason] || 'نیازمند بررسی'),
            card
        );

        const candidates =
            Array.isArray(m.candidate_threads)
            ? m.candidate_threads : [];

        node(
            'p',
            'پرونده‌های احتمالی: '+candidates.length,
            card
        ).className = 'gold';

        const assignmentButtons = [];

        for(const c of candidates){

            const r = node('div',null,card);
            r.className = 'candidate';

            node(
                'strong',
                '📁 حواله '+c.ad_id+
                ' | پیشنهاد '+c.offer_id,
                r
            );

            const type = c.trade_type || '';
            const owner = type.includes('خریدار') ? 'خریدار' : type.includes('فروشنده') ? 'فروشنده' : '';
            const label = owner && ['owner','proposer'].includes(c.participant_role) ? (c.participant_role === 'owner' ? owner : owner === 'خریدار' ? 'فروشنده' : 'خریدار') : 'طرف معامله (نقش نامشخص)';

            node('small',label,r);

            const assignButton = btn(
                'اختصاص پیام به این پرونده',
                async()=>{

                    const inboxId = Number(m.inbox_id);
                    const threadId = Number(c.thread_id);

                    if(
                        !Number.isSafeInteger(inboxId) ||
                        !Number.isSafeInteger(threadId) ||
                        inboxId <= 0 ||
                        threadId <= 0
                    ){
                        err('شناسه پیام یا گفتگو نامعتبر است.');
                        return;
                    }

                    if(assigning.has(inboxId)) return;

                    const confirmed = window.confirm(
                        'آیا پیام شماره '+inboxId+
                        ' به پرونده زیر اختصاص داده شود؟\n\n'+
                        'حواله: '+c.ad_id+'\n'+
                        'پیشنهاد: '+c.offer_id+'\n'+
                        'طرف معامله: '+label+'\n\n'+
                        'لطفاً از انتخاب پرونده صحیح مطمئن شوید.'
                    );

                    if(!confirmed) return;

                    assigning.add(inboxId);

                    for(const b of assignmentButtons){
                        b.disabled = true;
                    }

                    assignButton.textContent =
                        'در حال اختصاص پیام...';

                    err('');
                    notice.textContent = '';

                    let success = false;

                    try{

                        const result = await api(
                            '/center/api/inbox/assign',
                            {
                                inbox_id:inboxId,
                                thread_id:threadId
                            }
                        );

                        if(
                            result.status !== 'assigned' ||
                            result.inbox_id !== inboxId ||
                            result.thread_id !== threadId ||
                            !Number.isSafeInteger(result.message_id) ||
                            result.message_id <= 0
                        ){
                            throw Error(
                                'نتیجه انتقال نامشخص است؛ صندوق انتظار را به‌روزرسانی کنید.'
                            );
                        }

                        success = true;

                        if(g !== generation){
                            if(view === 'inbox'){
                                await openInbox();
                            }
                            return;
                        }

                        card.remove();

                        loaded = Math.max(0,loaded-1);

                        updateCount();

                        notice.textContent =
                            '✓ پیام شماره '+inboxId+
                            ' به حواله '+c.ad_id+
                            '، پیشنهاد '+c.offer_id+
                            ' اختصاص یافت.';

                    }catch(e){

                        if(g === generation){
                            err(
                                (e.message || String(e))+
                                ' ابتدا صندوق انتظار را به‌روزرسانی کنید.'
                            );
                        }

                    }finally{

                        assigning.delete(inboxId);

                        if(!success){
                            assignButton.textContent =
                                'اختصاص پیام به این پرونده';

                            for(const b of assignmentButtons){
                                b.disabled = true;
                            }
                        }
                    }
                },
                r
            );

            assignButton.className = 'assign-button';

            assignButton.disabled =
                assigning.has(Number(m.inbox_id));

            assignmentButtons.push(assignButton);
        }

        if(!candidates.length){
            node(
                'small',
                'پرونده فعالی برای این پیام پیدا نشده است.',
                card
            );
        }

        const actions = node('div',null,card);
        actions.className = 'toolbar';
        actions.style.marginTop = '12px';

        btn('کپی پیام',()=>{
            navigator.clipboard.writeText(
                m.message_text || ''
            ).catch(err);
        },actions);
    }

    async function loadPage(){

        if(loading || g !== generation) return;

        loading = true;
        more.disabled = true;
        err('');

        try{

            const x = await api(
                '/center/api/inbox'+
                (before ? '?before='+before : '')
            );

            if(g !== generation) return;

            const rows = x.messages;

            if(!Array.isArray(rows)){
                throw Error('فهرست پیام‌ها نامعتبر است.');
            }

            for(const m of rows){
                drawMessage(m);
            }

            loaded += rows.length;

            updateCount();

            if(rows.length){
                before = rows.at(-1).inbox_id;
            }

            more.textContent = 'پیام‌های قدیمی‌تر';
            more.hidden = rows.length < 100;

            if(!loaded && more.hidden){
                count.textContent = 'صندوق انتظار خالی است.';
            }

        }catch(e){

            if(g !== generation) return;

            err(e);

            count.textContent =
                'پیام‌های دریافت‌شده: '+loaded;

            more.hidden = false;
            more.textContent = 'تلاش مجدد';

        }finally{
            loading = false;
            more.disabled = false;
        }
    }

    await loadPage();
}

async function openCase(c){
    selected = c;

    clear(
        'case',
        'حواله '+c.ad_id+' | پیشنهاد '+c.offer_id
    );

    btn('بازگشت',renderList);

    const g = generation;

    try{
        const x = await api(
            '/center/api/threads/'+c.agreement_id
        );

        if(g !== generation) return;

        for(const t of x.threads){

            const type = (c.ad || {}).trade_type || '';

            const owner = type.includes('خریدار')
                ? 'خریدار'
                : type.includes('فروشنده')
                ? 'فروشنده'
                : '';

            const label = owner
                ? (
                    t.participant_role === 'owner'
                    ? owner
                    : owner === 'خریدار'
                    ? 'فروشنده'
                    : 'خریدار'
                )
                : (
                    'طرف معامله (نقش نامشخص)'
                );

            const b = btn(
                '💬 گفتگوی '+label,
                ()=>openChat(t,label)
            );

            b.style.cssText =
                'display:block;width:100%;margin-top:12px';
        }

    }catch(e){
        if(g === generation) err(e);
    }
}

async function openChat(t,label){
    thread = t;
    role = label;
    history = [];

    clear(
        'chat',
        label+' | حواله '+selected.ad_id
    );

    const chatGeneration = generation;

    btn('بازگشت',()=>openCase(selected));

    btn(
        'پیام‌های قدیمی‌تر',
        ()=>refresh(true)
    );

    const area = node('div',null,root);
    area.id = 'messages';

    foot.style.display = 'flex';

    const input = node('textarea',null,foot);
    input.placeholder = 'نوشتن پیام...';
    input.maxLength = 4000;

    const active = selected.status === 'active';

    const send = btn('ارسال',async()=>{
        if(!active || busy || !input.value.trim()) return;

        busy = true;
        send.disabled = true;

        const g = generation;

        try{
            await api('/admin/minichat/send',{
                thread_id:t.thread_id,
                message_text:input.value.trim()
            });

            if(g === generation){
                input.value = '';
                await refresh();
            }

        }catch(e){
            if(g === generation) err(e);
        }finally{
            busy = false;
            send.disabled = !active;
        }
    },foot);

    const template = btn('متن آماده',()=>{
        input.value = 'لطفاً رسید پرداخت را ارسال کنید.';
    },foot);

    if(!active){
        input.disabled = true;
        send.disabled = true;
        template.disabled = true;
    }

    let refreshing = false;

    await refresh();

    async function refresh(old=false){
        const g = generation;

        if(
            view !== 'chat' ||
            thread !== t ||
            refreshing
        ) return;

        refreshing = true;

        try{
            const x = await api(
                '/center/api/messages/'+t.thread_id+
                (
                    old && history.length
                    ? '?before='+history[0].message_id
                    : ''
                )
            );

            if(g !== generation) return;

            const map = new Map(
                [...history,...x.messages].map(
                    m=>[m.message_id,m]
                )
            );

            const next = [...map.values()].sort(
                (a,b)=>a.message_id-b.message_id
            );

            if(
                JSON.stringify(next) ===
                JSON.stringify(history)
            ) return;

            history = next;

            const near =
                root.scrollHeight -
                root.scrollTop -
                root.clientHeight < 150;

            const previousHeight = root.scrollHeight;
            const previousTop = root.scrollTop;

            area.replaceChildren();

            for(const m of history){
                const b = node(
                    'div',
                    m.message_text || 'پیوست',
                    area
                );

                b.className =
                    'bubble'+
                    (m.sender_role === 'admin' ? ' mine' : '');

                node(
                    'small',
                    m.created_at
                    ? new Date(m.created_at).toLocaleString('fa-IR')
                    : '',
                    b
                );

                if(m.sender_role === 'admin') node('small', ({pending_v2:'در صف ارسال',sent:'ارسال شد',failed:'ارسال ناموفق',uncertain:'نتیجه نامشخص؛ ارسال مجدد نکنید'})[m.delivery_status] || 'پیام قدیمی؛ ارسال تأیید نشده', b);
                btn('کپی',()=>{
                    navigator.clipboard.writeText(
                        m.message_text || ''
                    ).catch(err);
                },b);

                const reply = btn('پاسخ',()=>{
                    input.value =
                        'در پاسخ به: '+
                        (m.message_text || '')+'\n';

                    input.focus();
                },b);

                reply.disabled = !active;
            }

            if(old){
                root.scrollTop =
                    previousTop +
                    root.scrollHeight -
                    previousHeight;
            }else if(near){
                root.scrollTop = root.scrollHeight;
            }

        }catch(e){
            if(g === generation) err(e);
        }finally{
            refreshing = false;
        }
    }

    if(chatGeneration !== generation) return;

    clearInterval(timer);

    timer = setInterval(()=>{
        if(
            view === 'chat' &&
            thread === t &&
            !busy &&
            !document.hidden
        ){
            refresh();
        }
    },2500);
}

login();

</script>
</html>
