:root{--bg:#080e1e;--panel:#121d33;--panel2:#172641;--gold:#e9c579;--txt:#edf3ff;--muted:#a3b2ce;--line:#2b3b58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.app{max-width:1000px;margin:auto;padding:16px 14px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{font-size:20px;font-weight:900;color:var(--gold);direction:ltr}.muted{color:var(--muted);font-size:12px;line-height:1.9}.small{font-size:11px}.pill{font-size:11px;background:#183d35;color:#95f4c6;padding:7px 10px;border-radius:50px}.heading{display:flex;align-items:center;gap:10px;margin:12px 0 18px}.heading h1{font-size:21px;margin:0}.back{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:12px;padding:10px}.hero{background:linear-gradient(125deg,#263c61,#101a30);border:1px solid #405778;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{font-size:22px;margin:0 0 10px}.hero p{margin:0;color:#c5d1e7;line-height:1.9}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.stat,.panel,.tile{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px}.stat b{display:block;color:var(--gold);font-size:25px;margin-top:6px}.stat small{color:var(--muted)}.panel{margin-bottom:12px}.panel h2{font-size:16px;margin:0 0 12px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.tile{text-align:right;color:var(--txt);min-height:90px}.tile strong{display:block;font-size:15px;margin:8px 0 4px}.tile span{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0;min-width:0}.row:last-child{border:0}.item{cursor:pointer}.item:active{background:var(--panel2)}.item>div{min-width:0}.value{color:var(--gold);font-weight:bold;white-space:nowrap}.tag{display:inline-block;border-radius:20px;padding:6px 9px;background:#293b5d;color:#c6d8f7;font-size:11px}.good{background:#164637;color:#80f1bc}.bad{background:#512c3b;color:#ffacb9}.btn{border:1px solid #405574;background:#1b2b49;color:var(--txt);border-radius:11px;padding:11px 13px;text-decoration:none;display:inline-block}.primary{background:linear-gradient(130deg,#b58b45,#f2d38e);border-color:transparent;color:#182038;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #405273;background:#0c1629;color:white;margin-bottom:12px;min-width:0}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.filters button{border:1px solid #405273;background:#192c48;color:var(--txt);padding:9px 12px;border-radius:10px;white-space:nowrap}.filters .active{background:var(--gold);color:#182038;font-weight:bold}.kvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv{background:#0e1a2e;border:1px solid var(--line);padding:12px;border-radius:12px;overflow-wrap:anywhere}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}.notice{padding:12px;background:#3b2d1e;border:1px solid #6d5530;border-radius:12px;color:#ffe1a1;line-height:1.9;margin:10px 0}.empty{color:var(--muted);padding:16px;line-height:2}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1425f7;border-top:1px solid #34425d;display:flex;justify-content:space-around;padding:9px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:var(--muted);min-width:65px;padding:6px 4px;font-size:11px}.bottom button span{display:block;font-size:22px;margin-bottom:4px}.bottom button.active{color:var(--gold)}.footer{font-size:11px;color:var(--muted);text-align:center;margin:18px}.hide{display:none!important}@media(min-width:700px){.stats{grid-template-columns:repe </style></head><body><div class="app"><header class="top"><div><div class="brand">✦ IRAN CHANGE</div><div class="muted">مرکز مدیریت معاملات</div></div><span class="pill" id="live">● در حال اتصال</span></header><main id="main"></main><div class="footer">IRAN CHANGE • اطلاعات همگام‌سازی‌شده Render</div></div><nav class="bottom" id="bottom" aria-label="ناوبری اصلی"></nav><script>
'use strict';
const API='https://iran-change-admin.onrender.com',MIN_VISIBLE_AD_ID=2512,el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('fa-IR'):esc(v);
const state={ads:[],offers:[],conversations:[],deals:[],loaded:{},errors:{},archived:false,adQuery:'',offerFilter:'all',conversationFilter:'all',dealFilter:'all',adminKey:'',actions:[],support:[],supportLoaded:false,supportUser:null,supportNotice:'',mcAgreements:[],mcThreads:[],mcMessages:[],mcAgreement:null,mcThread:null,mcError:'',notice:''};
const titles={home:'خانه',ads:'آگهی‌ها',offers:'پیشنهادها',conversations:'مکالمات',deals:'توافق‌ها',channels:'کانال‌ها',support:'پشتیبانی',activities:'فعالیت‌ها',reports:'گزارش‌ها',documents:'مدارک',finance:'امور مالی',more:'بیشتر',ad:'پرونده آگهی',offer:'پرونده پیشنهاد',conversation:'پرونده مکالمه',deal:'پرونده توافق',channel:'کانال'};
const routes={home:'خانه',deals:'معاملات',support:'پیام‌ها',more:'بیشتر'};
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
const row=(a,b)=>`<div class="row"><div>${a}</div><div>${b}</div></div>`;
const tag=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;
const button=(text,route,cls='')=>`<button class="btn ${cls}" data-route="${esc(route)}">${text}</button>`;
const kv=(label,value)=>`<div class="kv"><span>${esc(label)}</span><b>${value}</b></div>`;
const empty=msg=>`<div class="empty">${esc(msg)}</div>`;
const adStatus=s=>String(s).toLowerCase()==='active'?'فعال':String(s).toLowerCase()==='closed'?'بسته':String(s||'نامشخص');
const offerStatus=s=>({accepted:'پذیرفته‌شده',pending:'در انتظار',rejected:'ردشده',closed:'بسته'}[s]||s||'نامشخص');
const conversationStatus=s=>({active:'فعال',open:'فعال',closed:'بسته',paused:'متوقف'}[s]||s||'نامشخص');
const dealStatus=s=>({agreed:'توافق‌شده',completed:'تکمیل‌شده',admin_review:'بررسی مدیر',cancelled:'لغوشده',awaiting_confirmation:'منتظر تأیید'}[s]||s||'نامشخص');
function current(){const raw=decodeURIComponent(location.hash.slice(1)||'home');const [page,id]=raw.split('/');return {page:titles[page]?page:'home',id:id||''};}
const positions=new Map();let lastRoute='';
function route(page,id){const key=page+(id?'/'+id:'');if(location.hash.slice(1)===key)return;positions.set(location.hash.slice(1)||'home',window.scrollY);location.hash=encodeURIComponent(key);}
function renderRoute(){const key=decodeURIComponent(location.hash.slice(1)||'home');const {page,id}=current();const restore=positions.get(key);const goingBack=key!==lastRoute&&restore!==undefined;lastRoute=key;el('main').innerHTML=page==='home'?home():page==='ads'?adsPage():page==='offers'?offersPage():page==='conversations'?conversationsPage():page==='deals'?dealsPage():page==='ad'?adPage(id):page==='offer'?offerPage(id):page==='conversation'?conversationPage(id):page==='deal'?dealPage(id):page==='channels'?channelsPage():page==='channel'?channelPage(id):page==='support'?supportPage():page==='activities'?activitiesPage():page==='reports'?reportsPage():page==='more'?morePage():page==='documents'?placeholder('مدارک'):page==='finance'?placeholder('امور مالی'):home();
 const nav=[['home','⌂','خانه'],['deals','🤝','معاملات'],['support','✉','پیام‌ها'],['more','☷','بیشتر']];el('bottom').innerHTML=nav.map(([p,icon,t])=>`<button data-route="${p}" class="${(page===p||page==='deal'&&p==='deals')?'active':''}"><span>${icon}</span>${t}</button>`).join('');
 const q=el('adSearch');if(q)q.addEventListener('input',e=>{state.adQuery=e.target.value;el('adList').innerHTML=adRows(filteredAds());});
 requestAnimationFrame(()=>window.scrollTo(0,goingBack?restore:0));
}
function head(title){return `<div class="heading"><button class="back" data-back="1" aria-label="بازگشت">❯</button><h1>${esc(title)}</h1></div>`;}
function statusText(){const errors=Object.values(state.errors).filter(Boolean);return errors.length?'● اتصال ناقص':'● اطلاعات واقعی';}
function stat(label,value){return `<div class="stat"><small>${label}</small><b>${fmt(value)}</b></div>`;}
function tile(icon,title,detail,page){return `<button class="tile" data-route="${page}"><div style="font-size:23px">${icon}</div><strong>${title}</strong><span>${detail}</span></button>`;}
function home(){return `<div class="hero"><h1>داشبورد مدیریت ✨</h1><p>همه فعالیت‌های مهم ایران چنج، بدون شلوغی و اسکرول بی‌پایان.</p></div><div class="stats">${stat('آگهی‌ها',state.ads.length)}${stat('فعال',state.ads.filter(a=>adStatus(a.status)==='فعال').length)}${stat('پیشنهادها',state.offers.length)}${stat('مکالمات',state.conversations.length)}${stat('توافق‌ها',state.deals.length)}</div>${panel('دسترسی سریع',`<div class="tiles">${tile('📣','آگهی‌ها','فهرست و جستجو','ads')}${tile('📩','پیشنهادها','وضعیت پیشنهادها','offers')}${tile('🤝','توافق‌ها','پرونده معاملات','deals')}${tile('💬','مکالمات','گفتگوهای ربات','conversations')}${tile('📡','کانال‌ها','یورو، دلار و سایر','channels')}${tile('🛟','پشتیبانی','پیام‌های کاربران','support')}${tile('📊','گزارش‌ها','آمار فعالیت','reports')}${tile('⚙️','مدیریت','ورود و فعالیت‌ها','activities')}</div>`)}${panel('اتصال و داده‌ها',`<div class="muted" id="connectionInfo">${esc(Object.values(state.errors).filter(Boolean).join(' | ')||'نمایش آخرین داده‌های همگام‌سازی‌شده با Render')}</div><div class="actions"><button class="btn primary" id="refresh">🔄 به‌روزرسانی</button><button class="btn" id="archive">${state.archived?'مخفی‌کردن سوابق قدیمی':'📂 نمایش سوابق قدیمی'}</button></div><div class="muted">سوابق قدیمی حذف نشده‌اند؛ به‌صورت پیش‌فرض فقط آگهی‌های ۲۵۱۲ به بعد نمایش داده می‌شوند.</div>`)}`;}
function adRows(items){return items.length?items.map(a=>`<div class="row item" data-route="ad/${a.ad_id}"><div><b>حواله ${fmt(a.ad_id)}</b><div class="muted">${esc(a.trade_type)} • ${fmt(a.amount)} ${esc(a.currency)}</div><div class="muted">${esc(a.method)} • ${esc(a.country)}</div></div><div style="text-align:left"><div class="value">${fmt(a.price)} تومان</div><div style="margin-top:7px">${tag(adStatus(a.status))}</div></div></div>`).join(''):empty('آگهی‌ای یافت نشد.');}
function filteredAds(){const q=state.adQuery.trim().toLowerCase();return state.ads.filter(a=>[a.ad_id,a.trade_type,a.currency,a.method,a.country,a.status].some(v=>String(v??'').toLowerCase().includes(q)));}
function adsPage(){return head('آگهی‌ها')+panel('جستجوی آگهی',`<input id="adSearch" class="search" placeholder="شماره حواله، ارز، کشور، روش انتقال..." value="${esc(state.adQuery)}"><div id="adList">${adRows(filteredAds())}</div>`);}
function offerRows(items){return items.length?items.map(o=>`<div class="row item" data-route="offer/${o.offer_id}"><div><b>پیشنهاد ${fmt(o.offer_id)}</b><div class="muted">حواله ${fmt(o.ad_id)} • ${esc(o.created_at||'')}</div></div><div style="text-align:left"><div class="value">${fmt(o.proposed_price)} تومان</div>${tag(offerStatus(o.status))}</div></div>`).join(''):empty('پیشنهادی یافت نشد.');}
function filters(type,options,selected){return `<div class="filters">${options.map(([v,t])=>`<button data-filter="${type}:${v}" class="${selected===v?'active':''}">${t}</button>`).join('')}</div>`;}
function offersPage(){return head('پیشنهادها')+panel('فهرست پیشنهادها',filters('offer',[['all','همه'],['pending','در انتظار'],['accepted','پذیرفته‌شده'],['rejected','ردشده']],state.offerFilter)+offerRows(state.offers.filter(o=>state.offerFilter==='all'||o.status===state.offerFilter)));}
function conversationRows(items){return items.length?items.map(c=>`<div class="row item" data-route="conversation/${c.conversation_id}"><div><b>مکالمه ${fmt(c.conversation_id)}</b><div class="muted">حواله ${fmt(c.ad_id)}</div><div class="muted">${esc(c.updated_at||c.created_at||'')}</div></div>${tag(conversationStatus(c.status))}</div>`).join(''):empty('مکالمه‌ای یافت نشد.');}
function conversationsPage(){return head('مکالمات')+panel('فهرست مکالمات',filters('conversation',[['all','همه'],['active','فعال'],['closed','بسته‌شده']],state.conversationFilter)+conversationRows(state.conversations.filter(c=>state.conversationFilter==='all'||(state.conversationFilter==='active'?['active','open'].includes(c.status):c.status===state.conversationFilter))));}
function dealRows(items){return items.length?items.map(d=>`<div class="row item" data-route="deal/${d.ad_id}"><div><b>توافق حواله ${fmt(d.ad_id)}</b><div class="muted">پیشنهاد ${fmt(d.offer_id)} • ${esc(d.created_at||'')}</div></div>${tag(dealStatus(d.state))}</div>`).join(''):empty('توافقی یافت نشد.');}
function dealsPage(){return head('توافق‌ها')+panel('مدیریت توافق‌ها',filters('deal',[['all','همه'],['agreed','توافق‌شده'],['awaiting_confirmation','منتظر تأیید'],['admin_review','بررسی مدیر'],['completed','تکمیل‌شده'],['cancelled','لغوشده']],state.dealFilter)+dealRows(state.deals.filter(d=>state.dealFilter==='all'||d.state===state.dealFilter)));}
function adPage(id){const a=state.ads.find(x=>String(x.ad_id)===id);if(!a)return head('پرونده آگهی')+empty('آگهی یافت نشد.');return head('پرونده حواله '+fmt(id))+panel('مشخصات آگهی',`<div class="kvgrid">${[['نوع',a.trade_type],['ارز',a.currency],['مقدار',fmt(a.amount)],['نرخ',fmt(a.price)+' تومان'],['روش انتقال',a.method],['کشور',a.country],['وضعیت',adStatus(a.status)],['تاریخ',a.created_at]].map(([k,v])=>kv(k,esc(v))).join('')}</div>`)+panel('پیشنهادهای مرتبط',offerRows(state.offers.filter(o=>String(o.ad_id)===id)))+panel('مکالمات مرتبط',conversationRows(state.conversations.filter(c=>String(c.ad_id)===id)))+panel('توافق مرتبط',dealRows(state.deals.filter(d=>String(d.ad_id)===id)));}
function offerPage(id){const o=state.offers.find(x=>String(x.offer_id)===id);return head('پرونده پیشنهاد')+(o?panel('جزئیات',`<div class="kvgrid">${kv('شماره پیشنهاد',fmt(o.offer_id))}${kv('حواله',fmt(o.ad_id))}${kv('نرخ',fmt(o.proposed_price)+' تومان')}${kv('وضعیت',offerStatus(o.status))}${kv('تاریخ',esc(o.created_at||''))}</div><div class="actions">${button('مشاهده آگهی','ad/'+o.ad_id,'primary')}</div>`):empty('پیشنهاد پیدا نشد.'));}
function conversationPage(id){const c=state.conversations.find(x=>String(x.conversation_id)===id);return head('پرونده مکالمه')+(c?panel('اطلاعات کلی',`<div class="kvgrid">${kv('شناسه مکالمه',fmt(c.conversation_id))}${kv('حواله',fmt(c.ad_id))}${kv('وضعیت',conversationStatus(c.status))}${kv('تاریخ',esc(c.created_at||''))}${kv('آخرین فعالیت',esc(c.updated_at||''))}</div><div class="notice">متن خصوصی مکالمات به این بخش منتقل نشده است.</div>${button('مشاهده آگهی','ad/'+c.ad_id,'primary')}`):empty('مکالمه یافت نشد.'));}
function dealPage(id){const d=state.deals.find(x=>String(x.ad_id)===id);if(!d)return head('پرونده توافق')+empty('توافق یافت نشد.');return head('توافق حواله '+fmt(id))+panel('مشخصات توافق',`<div class="kvgrid">${kv('حواله',fmt(d.ad_id))}${kv('پیشنهاد',fmt(d.offer_id))}${kv('وضعیت',dealStatus(d.state))}${kv('تأیید صاحب آگهی',Number(d.owner_confirmed)===1?'بله':'خیر')}${kv('تأیید پیشنهاددهنده',Number(d.proposer_confirmed)===1?'بله':'خیر')}${kv('درخواست لغو',d.cancel_requested?'ثبت شده':'ثبت نشده')}${kv('مهلت',esc(d.deadline||''))}${kv('تاریخ',esc(d.created_at||''))}</div><div class="notice">تغییر وضعیت معامله در این نسخه فعال نیست. داده‌های اصلی تغییر نمی‌کنند.</div><div class="actions">${button('مشاهده آگهی','ad/'+d.ad_id,'primary')}<button class="btn" id="mcOpen">گفت‌وگوهای مینی‌چت (قدیمی)</button></div>`)+mcPanel();}
const destinations=[['یورو','@IranChangeEuro','https://t.me/IranChangeEuro'],['دلار','@IranChangeDolar','https://t.me/IranChangeDolar'],['سایر','@IranChangeGlobal','https://t.me/IranChangeGlobal'],['دیدگاه‌ها','@FastChangeArzGroup','https://t.me/FastChangeArzGroup']];
function channelsPage(){return head('کانال‌ها')+panel('کانال‌های ایران چنج',destinations.map(([name,handle,url])=>row(`<b>${esc(name)}</b><div class="muted">${esc(handle)}</div>`,`<button class="btn" data-route="channel/${encodeURIComponent(name)}">مشاهده</button>`)).join(''));}
function channelPage(id){const name=decodeURIComponent(id),d=destinations.find(x=>x[0]===name);if(!d)return head('کانال')+empty('کانال یافت نشد.');const matches=state.ads.filter(a=>name==='یورو'?/یورو|EUR/i.test(a.currency):name==='دلار'?/دلار|USD/i.test(a.currency):name==='سایر'?!/یورو|EUR|دلار|USD/i.test(a.currency):false);return head('کانال '+name)+panel('اطلاعات کانال',`<div class="muted">${esc(d[1])}</div><div class="actions"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${d[2]}">باز کردن در تلگرام</a></div>`)+(name==='دیدگاه‌ها'?'':panel('آگهی‌های مرتبط',adRows(matches)));}
function reportsPage(){return head('گزارش‌ها')+panel('آگهی‌ها',row('کل آگهی‌ها',fmt(state.ads.length))+row('فعال',fmt(state.ads.filter(a=>adStatus(a.status)==='فعال').length))+row('بسته',fmt(state.ads.filter(a=>adStatus(a.status)==='بسته').length)))+panel('پیشنهادها',row('کل',fmt(state.offers.length))+row('در انتظار',fmt(state.offers.filter(o=>o.status==='pending').length))+row('پذیرفته‌شده',fmt(state.offers.filter(o=>o.status==='accepted').length)))+panel('مکالمات و توافق‌ها',row('مکالمات',fmt(state.conversations.length))+row('توافق‌ها',fmt(state.deals.length)));}
function morePage(){return head('بخش‌های مدیریت')+`<div class="tiles">${tile('📣','آگهی‌ها','مدیریت آگهی','ads')}${tile('📩','پیشنهادها','فهرست پیشنهاد','offers')}${tile('💬','مکالمات','گفتگوهای ربات','conversations')}${tile('📡','کانال‌ها','کانال‌ها و گروه','channels')}${tile('📂','مدارک','هنوز متصل نیست','documents')}${tile('💰','امور مالی','هنوز متصل نیست','finance')}${tile('📜','فعالیت‌ها','ورود و سوابق مدیر','activities')}${tile('📊','گزارش‌ها','گزارش عملکرد','reports')}</div>`;}
function placeholder(title){return head(title)+panel(title,empty('این بخش در نسخه فعلی به داده‌های عملیاتی متصل نیست. برای جلوگیری از نمایش اطلاعات غیرواقعی، فعال نشان داده نمی‌شود.'));}
function adminLoginPanel(){return panel('🔐 ورود مدیر',state.adminKey?`<div class="actions">${tag('ورود انجام شده','good')}<button class="btn" id="logout">خروج</button></div>`:`<div class="muted">کلید مدیریت Render را وارد کنید. این کلید در فایل سایت ذخیره نمی‌شود.</div><input id="adminPassword" type="password" autocomplete="off" class="search" placeholder="رمز مدیر"><button class="btn primary" id="login">ورود</button>`);}
function activitiesPage(){return head('فعالیت‌های مدیریت')+adminLoginPanel()+panel('سوابق اقدامات',state.adminKey?`<div class="actions"><button id="actionsRefresh" class="btn">دریافت سوابق</button></div>${state.actions.length?state.actions.filter(a=>visible(a.ad_id)).map(a=>row(`<b>حواله ${fmt(a.ad_id)}</b><div class="muted">${esc(a.reason||'بدون توضیح')} • ${esc(a.created_at||'')}</div>`,tag(a.action))).join(''):empty('اقدامی دریافت نشده است.')}`:empty('برای مشاهده سوابق وارد مدیریت شوید.'));}
function supportGroups(){const m=new Map();for(const x of state.support){const id=String(x.user_id??'');if(!/^\d+$/.test(id))continue;if(!m.has(id))m.set(id,[]);m.get(id).push(x);}return [...m.entries()].sort((a,b)=>Math.max(...b[1].map(x=>Number(x.id)||0))-Math.max(...a[1].map(x=>Number(x.id)||0)));}
function supportPage(){if(!state.adminKey)return head('پشتیبانی')+adminLoginPanel()+empty('برای دیدن پیام‌های پشتیبانی ابتدا وارد شوید.');const groups=supportGroups();let out=head('پشتیبانی')+panel('پیام‌های کاربران',`<div class="actions"><button class="btn primary" id="supportRefresh">🔄 دریافت پیام‌ها</button></div>${state.supportNotice?`<div class="notice">${esc(state.supportNotice)}</div>`:''}${!state.supportLoaded?empty('برای بارگذاری پیام‌ها، دریافت پیام‌ها را بزنید.'):groups.map(([uid,msgs])=>{const last=msgs[msgs.length-1];return `<div class="row item" data-support="${esc(uid)}"><div><b>کاربر ${esc(uid)}</b><div class="muted">${esc(String(last.body||last.file_name||'پیام').slice(0,75))}</div></div>${tag(fmt(msgs.length)+' پیام')}</div>`;}).join('')||empty('پیامی وجود ندارد.')}`);if(state.supportUser){const messages=groups.find(([uid])=>uid===state.supportUser)?.[1]||[];out+=panel('گفتگو با کاربر '+esc(state.supportUser),messages.map(m=>`<div class="kv" style="margin-bottom:8px"><span>${m.direction==='incoming'?'کاربر':'مدیر'} • ${esc(m.created_at||'')}</span><div style="white-space:pre-wrap">${esc(m.body||m.file_name||'[فایل]')}</div></div>`).join('')+`<textarea id="supportReply" class="search" rows="4" maxlength="4000" placeholder="متن پاسخ..."></textarea><button class="btn primary" id="supportSend">ثبت پاسخ برای ارسال توسط ربات</button><div class="muted">ثبت پاسخ به معنی تحویل قطعی در تلگرام نیست.</div>`);}return out;}
function mcPanel(){if(!state.adminKey)return panel('گفت‌وگوهای مینی‌چت قدیمی',empty('برای دیدن این بخش وارد مدیریت شوید.'));let body=`<div class="muted">این بخش قدیمی است؛ گفت‌وگوی مستقیم با ادمین تلگرام مستقل از آن انجام می‌شود.</div>${state.mcError?`<div class="notice">${esc(state.mcError)}</div>`:''}`;if(state.mcAgreement){body+=`<div class="actions">${state.mcThreads.map(t=>`<button class="btn ${state.mcThread===Number(t.thread_id)?'primary':''}" data-mcthread="${Number(t.thread_id)}">${t.participant_role==='owner'?'صاحب آگهی':'پیشنهاددهنده'}</button>`).join('')}</div>`;if(state.mcThread)body+=state.mcMessages.map(m=>`<div class="kv" style="margin:8px 0"><span>${esc(m.sender_role)} • ${esc(m.created_at||'')}</span>${esc(m.message_text||'[فایل]')}</div>`).join('')||empty('پیامی وجود ندارد.');}return panel('مینی‌چت قدیمی',body);}
function visible(id){return state.archived||Number(id)>=MIN_VISIBLE_AD_ID;}
async function collection(path,key){const r=await fetch(API+path+'?_='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d[key]))throw Error('پاسخ سرور معتبر نیست');return d[key];}
async function refresh(){el('live').textContent='● در حال دریافت';const endpoints=[['ads','/ads'],['offers','/offers'],['conversations','/conversations'],['deals','/deals']];await Promise.all(endpoints.map(async([key,path])=>{try{const data=await collection(path,key);state[key]=data.filter(x=>x&&visible(x.ad_id)).map(x=>({...x,status:String(x.status||'').toLowerCase(),state:String(x.state||'').toLowerCase()}));state.loaded[key]=true;state.errors[key]='';}catch(e){state.errors[key]=key+': '+e.message;}}));el('live').textContent=statusText();renderRoute();}
function headers(key=state.adminKey){return {'Accept':'application/json','X-Admin-Key':key};}
async function adminFetch(path,opts={}){const r=await fetch(API+path,{cache:'no-store',...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function login(){const pass=el('adminPassword')?.value.trim();if(!pass)return alert('رمز مدیریت را وارد کنید.');try{const r=await fetch(API+'/admin/verify',{method:'POST',headers:headers(pass),cache:'no-store'});if(!r.ok)throw Error('رمز صحیح نیست یا سرور آماده نیست');state.adminKey=pass;await Promise.allSettled([loadActions(),loadSupport()]);renderRoute();}catch(e){alert(e.message);}}
async function loadActions(){if(!state.adminKey)return;try{const d=await adminFetch('/admin/actions');state.actions=Array.isArray(d.actions)?d.actions:[];}catch(e){state.notice=e.message;}renderRoute();}
async function loadSupport(){if(!state.adminKey)return;try{const d=await adminFetch('/admin/support/messages?_='+Date.now());state.support=Array.isArray(d.messages)?d.messages:[];state.supportLoaded=true;state.supportNotice='';}catch(e){state.supportNotice='دریافت پیام‌ها ناموفق بود: '+e.message;}renderRoute();}
async function sendSupport(){const text=el('supportReply')?.value.trim();if(!text||!state.supportUser)return alert('متن پاسخ را وارد کنید.');const b=el('supportSend');b.disabled=true;try{await adminFetch('/admin/support/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(state.supportUser),body:text})});state.supportNotice='پاسخ در صف ارسال ربات ثبت شد؛ تحویل را در تلگرام بررسی کنید.';await loadSupport();}catch(e){state.supportNotice='خطا: '+e.message;renderRoute();}}
async function loadMiniChat(){const d=state.deals.find(x=>String(x.ad_id)===current().id);if(!d||!state.adminKey)return;state.mcError='';state.mcAgreement=null;state.mcThreads=[];state.mcMessages=[];try{const x=await adminFetch('/admin/minichat/agreements');const a=(x.agreements||[]).find(a=>Number(a.ad_id)===Number(d.ad_id)&&Number(a.offer_id)===Number(d.offer_id));if(!a){state.mcError='پرونده مینی‌چت برای این توافق ثبت نشده است.';}else{state.mcAgreement=a;const y=await adminFetch('/admin/minichat/threads/'+a.agreement_id);state.mcThreads=y.threads||[];}}catch(e){state.mcError=e.message;}renderRoute();}
async function loadThread(id){state.mcThread=id;try{const x=await adminFetch('/admin/minichat/messages/'+id);state.mcMessages=x.messages||[];}catch(e){state.mcError=e.message;}renderRoute();}
window.addEventListener('hashchange',renderRoute);
document.addEventListener('click',async e=>{const back=e.target.closest('[data-back]');if(back){if(history.length>1)history.back();else route('home');return;}const r=e.target.closest('[data-route]');if(r){const key=r.dataset.route;const [page,...id]=key.split('/');route(page,id.join('/'));return;}const f=e.target.closest('[data-filter]');if(f){const [type,v]=f.dataset.filter;state[type+'Filter']=v;renderRoute();return;}if(e.target.closest('#refresh'))return refresh();if(e.target.closest('#archive')){state.archived=!state.archived;return refresh();}if(e.target.closest('#login'))return login();if(e.target.closest('#logout')){state.adminKey='';state.actions=[];state.support=[];state.supportLoaded=false;state.supportUser=null;return renderRoute();}if(e.target.closest('#actionsRefresh'))return loadActions();if(e.target.closest('#supportRefresh'))return loadSupport();const su=e.target.closest('[data-support]');if(su){state.supportUser=su.dataset.support;return renderRoute();}if(e.target.closest('#supportSend'))return sendSupport();if(e.target.closest('#mcOpen'))return loadMiniChat();const t=e.target.closest('[data-mcthread]');if(t)return loadThread(Number(t.dataset.mcthread));});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='adminPassword')login();});
renderRoute();refresh();
</script></body></html>
