'use strict';
const API='https://iran-change-admin.onrender.com',MIN_VISIBLE_AD_ID=2512,el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined||v===''?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('fa-IR'):esc(v);
const state={ads:[],offers:[],conversations:[],deals:[],loaded:{},errors:{},archived:false,adQuery:'',offerFilter:'all',conversationFilter:'all',dealFilter:'all',adminKey:'',actions:[],support:[],supportLoaded:false,supportUser:null,supportNotice:'',mcAgreements:[],mcThreads:[],mcMessages:[],mcAgreement:null,mcThread:null,mcLoading:false,mcError:'',notice:''};
const titles={home:'خانه',ads:'آگهی‌ها',offers:'پیشنهادها',conversations:'مکالمات',deals:'توافق‌ها',channels:'کانال‌ها',support:'پشتیبانی',activities:'فعالیت‌ها',reports:'گزارش‌ها',documents:'مدارک',finance:'امور مالی',more:'بیشتر',ad:'پرونده آگهی',offer:'پرونده پیشنهاد',conversation:'پرونده مکالمه',deal:'پرونده توافق',channel:'کانال'};
const routes={home:'خانه',deals:'معاملات',support:'پیام‌ها',more:'بیشتر'};
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
const row=(a,b)=>`<div class="row"><div>${a}</div><div>${b}</div></div>`;
const tag=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;
const button=(text,route,cls='')=>`<button class="btn ${cls}" data-route="${esc(route)}">${text}</button>`;
const kv=(label,value)=>`<div class="kv"><span>${esc(label)}</span><b>${value}</b></div>`;
const empty=msg=>`<div class="empty">${esc(msg)}</div>`;
const adStatus=s=>String(s).toLowerCase()==='active'?'فعال':String(s).toLowerCase()==='closed'?'بسته':String(s||'نامشخص');
const offerStatus=s=>({accepted:'پذیرفته‌شده',pending:'در انتظار',rejected:'ردشده',closed:'بسته'}[s]||s||'نامشخص');
const conversationStatus=s=>({active:'فعال',open:'فعال',closed:'بسته',paused:'متوقف'}[s]||s||'نامشخص');
const dealStatus=s=>({agreed:'توافق‌شده',completed:'تکمیل‌شده',admin_review:'بررسی مدیر',cancelled:'لغوشده',awaiting_confirmation:'منتظر تأیید'}[s]||s||'نامشخص');
function current(){const raw=decodeURIComponent(location.hash.slice(1)||'home');const [page,id]=raw.split('/');return {page:titles[page]?page:'home',id:id||''};}
const positions=new Map();let lastRoute='';
function route(page,id){const key=page+(id?'/'+id:'');if(location.hash.slice(1)===key)return;positions.set(location.hash.slice(1)||'home',window.scrollY);location.hash=encodeURIComponent(key);}
function renderRoute(){const key=decodeURIComponent(location.hash.slice(1)||'home');const {page,id}=current();const restore=positions.get(key);const goingBack=key!==lastRoute&&restore!==undefined;lastRoute=key;el('main').innerHTML=page==='home'?home():page==='ads'?adsPage():page==='offers'?offersPage():page==='conversations'?conversationsPage():page==='deals'?dealsPage():page==='ad'?adPage(id):page==='offer'?offerPage(id):page==='conversation'?conversationPage(id):page==='deal'?dealPage(id):page==='channels'?channelsPage():page==='channel'?channelPage(id):page==='support'?supportPage():page==='activities'?activitiesPage():page==='reports'?reportsPage():page==='more'?morePage():page==='documents'?placeholder('مدارک'):page==='finance'?placeholder('امور مالی'):home();
 const nav=[['home','⌂','خانه'],['deals','🤝','معاملات'],['support','✉','پیام‌ها'],['more','☷','بیشتر']];el('bottom').innerHTML=nav.map(([p,icon,t])=>`<button data-route="${p}" class="${(page===p||page==='deal'&&p==='deals')?'active':''}"><span>${icon}</span>${t}</button>`).join('');
 const q=el('adSearch');if(q)q.addEventListener('input',e=>{state.adQuery=e.target.value;el('adList').innerHTML=adRows(filteredAds());});
 requestAnimationFrame(()=>window.scrollTo(0,goingBack?restore:0));
}
function head(title){return `<div class="heading"><button class="back" data-back="1" aria-label="بازگشت">❯</button><h1>${esc(title)}</h1></div>`;}
function statusText(){const errors=Object.values(state.errors).filter(Boolean);return errors.length?'● اتصال ناقص':'● اطلاعات واقعی';}
function stat(label,value){return `<div class="stat"><small>${label}</small><b>${fmt(value)}</b></div>`;}
function tile(icon,title,detail,page){return `<button class="tile" data-route="${page}"><div style="font-size:23px">${icon}</div><strong>${title}</strong><span>${detail}</span></button>`;}
function home(){const pending=state.offers.filter(x=>x.status==='pending').length,review=state.deals.filter(x=>x.state==='admin_review').length,waiting=state.deals.filter(x=>x.state==='awaiting_confirmation').length;return `<div class="welcome"><div class="eyebrow">مرکز فرماندهی / نمای کلی</div><h1>مدیریت هوشمند معاملات</h1><p>آنچه امروز به توجه شما نیاز دارد، یکجا.</p><div class="sync-line">${tag(statusText(),Object.values(state.errors).some(Boolean)?'bad':'good')} <button class="icon-button" id="refresh">⟳ به‌روزرسانی</button></div></div><div class="metric-grid">${metric('آگهی‌های فعال',state.ads.filter(a=>adStatus(a.status)==='فعال').length,'◈','ads')}${metric('پیشنهادهای جدید',pending,'↗','offers')}${metric('نیازمند بررسی',review,'!','deals')}${metric('منتظر تأیید',waiting,'◷','deals')}</div><div class="section-heading"><div><div class="eyebrow">اقدامات سریع</div><h2>میز کار مدیر</h2></div></div><div class="work-list">${work('⚡','پیشنهادهای در انتظار',fmt(pending)+' مورد برای پیگیری','offers')}${work('🤝','توافق‌های نیازمند اقدام',fmt(review+waiting)+' پرونده','deals')}${work('✉️','مرکز پشتیبانی','مشاهده و پاسخ به پیام‌های کاربران','support')}</div><div class="section-heading"><div><div class="eyebrow">مدیریت سامانه</div><h2>بخش‌های اصلی</h2></div></div><div class="feature-grid">${feature('▤','آگهی‌ها','ads')}${feature('↗','پیشنهادها','offers')}${feature('☷','مکالمات','conversations')}${feature('◎','توافق‌ها','deals')}${feature('◉','کانال‌ها','channels')}${feature('▥','گزارش‌ها','reports')}</div><div class="subtle-note">${esc(Object.values(state.errors).filter(Boolean).join(' | ')||'اطلاعات بر اساس آخرین همگام‌سازی با سرور Render نمایش داده می‌شود.')}</div>`;}
function metric(title,value,icon,to){return `<button class="metric" data-route="${to}"><span class="metric-icon">${icon}</span><small>${title}</small><strong>${fmt(value)}</strong><span class="metric-arrow">مشاهده ←</span></button>`;}
function work(icon,title,subtitle,to){return `<button class="work-item" data-route="${to}"><span class="work-icon">${icon}</span><span class="work-text"><strong>${title}</strong><small>${subtitle}</small></span><span class="chevron">‹</span></button>`;}
function feature(icon,title,to){return `<button class="feature" data-route="${to}"><span>${icon}</span><strong>${title}</strong></button>`;}
function adRows(items){return items.length?items.map(a=>`<div class="row item" data-route="ad/${a.ad_id}"><div><b>حواله ${fmt(a.ad_id)}</b><div class="muted">${esc(a.trade_type)} • ${fmt(a.amount)} ${esc(a.currency)}</div><div class="muted">${esc(a.method)} • ${esc(a.country)}</div></div><div style="text-align:left"><div class="value">${fmt(a.price)} تومان</div><div style="margin-top:7px">${tag(adStatus(a.status))}</div></div></div>`).join(''):empty('آگهی‌ای یافت نشد.');}
function filteredAds(){const q=state.adQuery.trim().toLowerCase();return state.ads.filter(a=>[a.ad_id,a.trade_type,a.currency,a.method,a.country,a.status].some(v=>String(v??'').toLowerCase().includes(q)));}
function adsPage(){return head('مرکز آگهی‌ها')+`<div class="page-intro">مدیریت و بررسی آگهی‌های همگام‌شده</div><div class="mini-metrics">${metric('کل آگهی‌ها',state.ads.length,'▤','ads')}${metric('فعال',state.ads.filter(a=>adStatus(a.status)==='فعال').length,'●','ads')}</div><section class="workspace"><div class="workspace-title"><h2>فهرست آگهی‌ها</h2><span class="counter">${fmt(filteredAds().length)} مورد</span></div><input id="adSearch" class="search" placeholder="⌕ جستجوی شماره حواله، ارز، کشور..." value="${esc(state.adQuery)}"><div id="adList">${adRows(filteredAds())}</div></section>`;}

function dealPage(id){const d=state.deals.find(x=>String(x.ad_id)===id);if(!d)return head('پرونده توافق')+empty('توافق یافت نشد.');return head('توافق حواله '+fmt(id))+panel('مشخصات توافق',`<div class="kvgrid">${kv('حواله',fmt(d.ad_id))}${kv('پیشنهاد',fmt(d.offer_id))}${kv('وضعیت',dealStatus(d.state))}${kv('تأیید صاحب آگهی',Number(d.owner_confirmed)===1?'بله':'خیر')}${kv('تأیید پیشنهاددهنده',Number(d.proposer_confirmed)===1?'بله':'خیر')}${kv('درخواست لغو',d.cancel_requested?'ثبت شده':'ثبت نشده')}${kv('مهلت',esc(d.deadline||''))}${kv('تاریخ',esc(d.created_at||''))}</div><div class="notice">تغییر وضعیت معامله در این نسخه فعال نیست. داده‌های اصلی تغییر نمی‌کنند.</div><div class="actions">${button('مشاهده آگهی','ad/'+d.ad_id,'primary')}</div>`)+mcPanel();}

function supportGroups(){const m=new Map();for(const x of state.support){const id=String(x.user_id??'');if(!/^\d+$/.test(id))continue;if(!m.has(id))m.set(id,[]);m.get(id).push(x);}return [...m.entries()].sort((a,b)=>Math.max(...b[1].map(x=>Number(x.id)||0))-Math.max(...a[1].map(x=>Number(x.id)||0)));}
function supportPage(){if(!state.adminKey)return head('پشتیبانی')+adminLoginPanel()+empty('برای دیدن پیام‌های پشتیبانی ابتدا وارد شوید.');const groups=supportGroups();let out=head('پشتیبانی')+panel('پیام‌های کاربران',`<div class="actions"><button class="btn primary" id="supportRefresh">🔄 دریافت پیام‌ها</button></div>${state.supportNotice?`<div class="notice">${esc(state.supportNotice)}</div>`:''}${!state.supportLoaded?empty('برای بارگذاری پیام‌ها، دریافت پیام‌ها را بزنید.'):groups.map(([uid,msgs])=>{const last=[...msgs].sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0))[0];return `<div class="row item" data-support="${esc(uid)}"><div><b>کاربر ${esc(uid)}</b><div class="muted">${esc(String(last.body||last.file_name||'پیام').slice(0,75))}</div></div>${tag(fmt(msgs.length)+' پیام')}</div>`;}).join('')||empty('پیامی وجود ندارد.')}`);if(state.supportUser){const messages=[...(groups.find(([uid])=>uid===state.supportUser)?.[1]||[])].sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0));out+=panel('گفتگو با کاربر '+esc(state.supportUser),messages.map(m=>`<div class="kv" style="margin-bottom:8px"><span>${m.direction==='incoming'?'کاربر':'مدیر'} • ${esc(m.created_at||'')}</span><div style="white-space:pre-wrap">${esc(m.body||m.file_name||'[فایل]')}</div></div>`).join('')+`<textarea id="supportReply" class="search" rows="4" maxlength="4000" placeholder="متن پاسخ..."></textarea><button class="btn primary" id="supportSend">ثبت پاسخ برای ارسال توسط ربات</button><div class="muted">ثبت پاسخ به معنی تحویل قطعی در تلگرام نیست.</div>`);}return out;}
function mcFileMarkup(m){
 const id=Number(m.message_id),name=String(m.message_text||m.file_name||'فایل پیوست');
 const ext=name.split('.').pop().toLowerCase();
 const icon=['jpg','jpeg','png','gif','webp','heic'].includes(ext)?'🖼️':['mp4','mov','webm','mkv'].includes(ext)?'🎬':['mp3','ogg','oga','m4a','wav','aac','webm'].includes(ext)?'🎤':['pdf'].includes(ext)?'📄':'📎';
 return `<div class="chat-file"><div class="chat-file-name">${icon} ${esc(name)}</div>${Number.isSafeInteger(id)&&id>0?`<div class="chat-file-actions"><button class="btn primary" data-mcfile="${id}" data-mcaction="download">📥 دریافت فایل</button><button class="btn" data-mcfile="${id}" data-mcaction="preview">👁 نمایش / پخش</button></div><div class="chat-file-status" id="mcfile-status-${id}"></div><div id="mcfile-preview-${id}"></div>`:'<div class="notice">شناسه فایل در پاسخ سرور موجود نیست؛ لازم است API پیام‌ها message_id را برگرداند.</div>'}</div>`;
}
const mcPreviewUrls=new Map();
function clearMcPreviews(){for(const url of mcPreviewUrls.values())URL.revokeObjectURL(url);mcPreviewUrls.clear();}
function mcSetFileStatus(id,msg){const node=el('mcfile-status-'+id);if(node)node.textContent=msg;}
function mcMediaType(name,blob){const ext=String(name||'').split('.').pop().toLowerCase();const map={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',pdf:'application/pdf'};return map[ext]||'';}
async function mcFileAction(id,action){
 const message=state.mcMessages.find(m=>Number(m.message_id)===id&&m.message_type==='file');
 if(!message||!state.adminKey)return alert('فایل یا دسترسی مدیر معتبر نیست.');
 const name=String(message.message_text||message.file_name||'document').replace(/[\/\\\r\n]/g,'_').slice(0,180)||'document';
 const buttons=document.querySelectorAll('[data-mcfile="'+id+'"]');buttons.forEach(b=>b.disabled=true);
 mcSetFileStatus(id,'در حال دریافت امن فایل…');
 try{
  const response=await fetch(API+'/admin/minichat/files/'+id,{method:'GET',cache:'no-store',headers:headers()});
  if(!response.ok)throw Error('HTTP '+response.status+(response.status===401?'؛ ورود مدیر معتبر نیست':'؛ دریافت فایل ناموفق بود'));
  const data=await response.blob();if(!data.size)throw Error('فایل دریافتی خالی است.');
  const type=mcMediaType(name,data);
  const blob=type?new Blob([data],{type}):data;
  const url=URL.createObjectURL(blob);
  if(action==='download'){
   const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
   mcSetFileStatus(id,'دریافت فایل آغاز شد.');
  }else{
   const holder=el('mcfile-preview-'+id);if(!holder){URL.revokeObjectURL(url);return;}
   const previous=mcPreviewUrls.get(id);if(previous)URL.revokeObjectURL(previous);
   mcPreviewUrls.set(id,url);holder.replaceChildren();
   let element;
   if(type.startsWith('image/')){element=document.createElement('img');element.className='chat-file-preview';element.alt=name;}
   else if(type.startsWith('audio/')){element=document.createElement('audio');element.className='chat-file-media';element.controls=true;}
   else if(type.startsWith('video/')){element=document.createElement('video');element.className='chat-file-media';element.controls=true;element.playsInline=true;}
   else if(type==='application/pdf'){element=document.createElement('iframe');element.className='chat-file-media';element.style.height='450px';element.title=name;}
   else{URL.revokeObjectURL(url);mcPreviewUrls.delete(id);mcSetFileStatus(id,'پیش‌نمایش این نوع فایل پشتیبانی نمی‌شود؛ از «دریافت فایل» استفاده کنید.');return;}
   element.src=url;holder.append(element);mcSetFileStatus(id,'فایل آماده نمایش است.');
  }
 }catch(e){mcSetFileStatus(id,'خطا: '+e.message);}
 finally{buttons.forEach(b=>b.disabled=false);}
}
function mcPanel(){
 if(!state.adminKey)return panel('گفت‌وگوهای خصوصی طرفین',`<div class="muted">برای مشاهده و پاسخ به گفت‌وگوها ابتدا از بخش «فعالیت‌ها» وارد مدیریت شوید.</div>${button('ورود مدیر','activities','primary')}`);
 let body=`<div class="muted">گفت‌وگوی صاحب آگهی و پیشنهاددهنده کاملاً جداست. پاسخ فقط به گفت‌وگوی انتخاب‌شده ارسال می‌شود.</div>`;
 body+=`<div class="actions"><button class="btn" id="mcOpen" ${state.mcLoading?'disabled':''}>${state.mcLoading?'در حال دریافت…':'⟳ دریافت گفت‌وگوها'}</button></div>`;
 if(state.mcError)body+=`<div class="notice">${esc(state.mcError)}</div>`;
 if(state.mcAgreement){
  if(!state.mcThreads.length)body+=empty('برای این توافق گفت‌وگویی در سرور ثبت نشده است.');
  else{
   body+=`<div class="actions">${state.mcThreads.map(t=>`<button class="btn ${state.mcThread===Number(t.thread_id)?'primary':''}" data-mcthread="${Number(t.thread_id)}">${t.participant_role==='owner'?'👤 صاحب آگهی':t.participant_role==='proposer'?'👤 پیشنهاددهنده':'گفت‌وگو '+fmt(t.thread_id)}</button>`).join('')}</div>`;
   if(state.mcThread){
    body+=`<div class="muted" style="margin:12px 0">${state.mcThreads.find(t=>Number(t.thread_id)===state.mcThread)?.participant_role==='owner'?'گفت‌وگوی خصوصی صاحب آگهی':'گفت‌وگوی خصوصی پیشنهاددهنده'}</div>`;
    body+=`<div class="chat-messages">${state.mcMessages.length?state.mcMessages.map(m=>`<div class="chat-bubble ${m.sender_role==='admin'?'mine':''}"><div class="muted">${m.sender_role==='admin'?'مدیر':'کاربر'} • ${esc(m.created_at||'')}</div>${m.message_type==='file'?mcFileMarkup(m):`<div class="chat-text">${esc(m.message_text||'')}</div>`}</div>`).join(''):empty('هنوز پیامی در این گفت‌وگو وجود ندارد.')}</div>`;
    body+=`<label for="mcReply" class="muted">پاسخ به همین طرف توافق</label><textarea id="mcReply" class="search" rows="3" maxlength="4000" placeholder="متن پاسخ مدیر..."></textarea><button class="btn primary" id="mcSend">ارسال پاسخ</button>`;
   }
  }
 }else if(!state.mcLoading&&!state.mcError)body+=empty('برای بارگذاری پرونده، «دریافت گفت‌وگوها» را بزنید.');
 return panel('گفت‌وگوهای خصوصی طرفین',body);
}
function visible(id){return state.archived||Number(id)>=MIN_VISIBLE_AD_ID;}
async function collection(path,key){const r=await fetch(API+path+'?_='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d[key]))throw Error('پاسخ سرور معتبر نیست');return d[key];}
async function refresh(){el('live').textContent='● در حال دریافت';const endpoints=[['ads','/ads'],['offers','/offers'],['conversations','/conversations'],['deals','/deals']];await Promise.all(endpoints.map(async([key,path])=>{try{const data=await collection(path,key);state[key]=data.filter(x=>x&&visible(x.ad_id)).map(x=>({...x,status:String(x.status||'').toLowerCase(),state:String(x.state||'').toLowerCase()}));state.loaded[key]=true;state.errors[key]='';}catch(e){state.errors[key]=key+': '+e.message;}}));el('live').textContent=statusText();renderRoute();}
function headers(key=state.adminKey){return {'Accept':'application/json','X-Admin-Key':key};}
async function adminFetch(path,opts={}){const r=await fetch(API+path,{cache:'no-store',...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function login(){const pass=el('adminPassword')?.value.trim();if(!pass)return alert('رمز مدیریت را وارد کنید.');try{const r=await fetch(API+'/admin/verify',{method:'POST',headers:headers(pass),cache:'no-store'});if(!r.ok)throw Error('رمز صحیح نیست یا سرور آماده نیست');state.adminKey=pass;await Promise.allSettled([loadActions(),loadSupport()]);renderRoute();}catch(e){alert(e.message);}}
async function loadActions(){if(!state.adminKey)return;try{const d=await adminFetch('/admin/actions');state.actions=Array.isArray(d.actions)?d.actions:[];}catch(e){state.notice=e.message;}renderRoute();}
async function loadSupport(){if(!state.adminKey)return;try{const d=await adminFetch('/admin/support/messages?_='+Date.now());state.support=Array.isArray(d.messages)?d.messages:[];state.supportLoaded=true;state.supportNotice='';}catch(e){state.supportNotice='دریافت پیام‌ها ناموفق بود: '+e.message;}renderRoute();}
async function sendSupport(){const text=el('supportReply')?.value.trim();if(!text||!state.supportUser)return alert('متن پاسخ را وارد کنید.');const b=el('supportSend');b.disabled=true;try{await adminFetch('/admin/support/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(state.supportUser),body:text})});state.supportNotice='پاسخ در صف ارسال ربات ثبت شد؛ تحویل را در تلگرام بررسی کنید.';await loadSupport();}catch(e){state.supportNotice='خطا: '+e.message;renderRoute();}}
async function loadMiniChat(){
 const deal=state.deals.find(x=>String(x.ad_id)===current().id);
 if(!deal||!state.adminKey)return;
 const dealId=String(deal.ad_id),offerId=Number(deal.offer_id);
 clearMcPreviews();state.mcLoading=true;state.mcError='';state.mcAgreement=null;state.mcThreads=[];state.mcThread=null;state.mcMessages=[];renderRoute();
 try{
  const x=await adminFetch('/admin/minichat/agreements');
  if(!Array.isArray(x.agreements))throw Error('فهرست پرونده‌ها از سرور دریافت نشد.');
  const a=x.agreements.find(a=>String(a.ad_id)===dealId&&Number(a.offer_id)===offerId);
  if(!a){state.mcError='پرونده گفت‌وگو برای این توافق در سرور ثبت نشده است.';return;}
  const y=await adminFetch('/admin/minichat/threads/'+encodeURIComponent(a.agreement_id));
  if(!Array.isArray(y.threads))throw Error('فهرست گفت‌وگوهای طرفین معتبر نیست.');
  if(current().page!=='deal'||current().id!==dealId)return;
  state.mcAgreement=a;state.mcThreads=y.threads;
  const preferred=y.threads.find(t=>t.participant_role==='owner')||y.threads[0];
  if(preferred)await loadThread(Number(preferred.thread_id),false);
 }catch(e){if(current().page==='deal'&&current().id===dealId)state.mcError='دریافت گفت‌وگوها ناموفق بود: '+e.message;}
 finally{state.mcLoading=false;renderRoute();}
}
async function loadThread(id,show=true){
 if(!state.mcThreads.some(t=>Number(t.thread_id)===Number(id)))return;
 clearMcPreviews();state.mcThread=Number(id);state.mcMessages=[];state.mcError='';if(show)renderRoute();
 try{
  const x=await adminFetch('/admin/minichat/messages/'+encodeURIComponent(id));
  if(!Array.isArray(x.messages))throw Error('پاسخ پیام‌ها معتبر نیست.');
  if(state.mcThread===Number(id))state.mcMessages=x.messages;
 }catch(e){if(state.mcThread===Number(id))state.mcError='دریافت پیام‌ها ناموفق بود: '+e.message;}
 renderRoute();
}
async function sendMiniChat(){
 const message=el('mcReply')?.value.trim(),id=state.mcThread;
 if(!id||!message)return alert('ابتدا گفت‌وگو را انتخاب و متن پیام را وارد کنید.');
 if(!state.mcThreads.some(t=>Number(t.thread_id)===id))return alert('گفت‌وگوی انتخاب‌شده معتبر نیست.');
 const b=el('mcSend');if(b)b.disabled=true;
 try{
  await adminFetch('/admin/minichat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thread_id:id,message_text:message})});
  await loadThread(id);
 }catch(e){state.mcError='ثبت پاسخ ناموفق بود: '+e.message;renderRoute();}
 finally{if(el('mcSend'))el('mcSend').disabled=false;}
}
window.addEventListener('hashchange',renderRoute);
document.addEventListener('click',async e=>{const back=e.target.closest('[data-back]');if(back){if(history.length>1)history.back();else route('home');return;}const r=e.target.closest('[data-route]');if(r){const key=r.dataset.route;const [page,...id]=key.split('/');route(page,id.join('/'));return;}const f=e.target.closest('[data-filter]');if(f){const [type,v]=f.dataset.filter;state[type+'Filter']=v;renderRoute();return;}if(e.target.closest('#refresh'))return refresh();if(e.target.closest('#archive')){state.archived=!state.archived;return refresh();}if(e.target.closest('#login'))return login();if(e.target.closest('#logout')){clearMcPreviews();state.mcAgreement=null;state.mcThreads=[];state.mcMessages=[];state.mcThread=null;state.adminKey='';state.actions=[];state.support=[];state.supportLoaded=false;state.supportUser=null;return renderRoute();}if(e.target.closest('#actionsRefresh'))return loadActions();if(e.target.closest('#supportRefresh'))return loadSupport();const su=e.target.closest('[data-support]');if(su){state.supportUser=su.dataset.support;return renderRoute();}if(e.target.closest('#supportSend'))return sendSupport();if(e.target.closest('#mcOpen'))return loadMiniChat();if(e.target.closest('#mcSend'))return sendMiniChat();const fileButton=e.target.closest('[data-mcfile]');if(fileButton)return mcFileAction(Number(fileButton.dataset.mcfile),fileButton.dataset.mcaction);const t=e.target.closest('[data-mcthread]');if(t)return loadThread(Number(t.dataset.mcthread));});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='adminPassword')login();});
renderRoute();refresh();
</script></body></html>
